name: iOS app
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      capture:
        description: "Also run the launch film capture takes"
        type: boolean
        default: false
jobs:
  simulator:
    runs-on: macos-15
    # Write access only so manual runs can publish full-size screenshots to their own branch.
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build app and widgets for the iOS Simulator
        run: |
          mkdir -p build
          if ! xcodebuild -project Blockpulse.xcodeproj -scheme Blockpulse -configuration Debug \
              -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd \
              CODE_SIGNING_ALLOWED=NO build > build/xcodebuild.log 2>&1; then
            grep -E "error:" build/xcodebuild.log | sort -u | head -80
            tail -40 build/xcodebuild.log
            exit 1
          fi
          grep -E "warning:.*/(App|Widgets)/" build/xcodebuild.log | sort -u | head -40 || true
          tail -3 build/xcodebuild.log
      - name: Build the capture tests (launch film takes)
        run: |
          if ! xcodebuild -project Blockpulse.xcodeproj -scheme BlockpulseCapture -configuration Debug \
              -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd \
              CODE_SIGNING_ALLOWED=NO build-for-testing > build/capture-build.log 2>&1; then
            grep -E "error:" build/capture-build.log | sort -u | head -40
            exit 1
          fi
      # Manual runs with "capture" ticked run every take once (about 17 min), to prove the scripted
      # gestures still work. They skip the screenshots.
      - name: Capture takes (manual runs)
        if: github.event_name == 'workflow_dispatch' && inputs.capture
        run: |
          SIM_NAME="$(xcrun simctl list devices available | grep -o 'iPhone [0-9]* Pro Max' | sort -V | tail -1)" scripts/mac-capture.sh captures
          ls -la captures
      # Screenshots take most of the run (14 launches of 20 s plus simulator boot), so they only run
      # when asked: Actions → iOS app → Run workflow. Pushes and PRs just build and run the live check.
      - name: Simulator screenshots (manual runs, not capture runs)
        if: github.event_name == 'workflow_dispatch' && !inputs.capture
        # Pro Max: 1320 x 2868, the 6.9" size App Store Connect asks for.
        run: |
          SIM_NAME="$(xcrun simctl list devices available | grep -o 'iPhone [0-9]* Pro Max' | sort -V | tail -1)" \
            scripts/ci-screenshots.sh build/dd/Build/Products/Debug-iphonesimulator/Blockpulse.app screenshots
      # Manual runs also push the full-size PNGs to a throwaway branch screenshots/run-<id>, so tools
      # that can't download artifacts can fetch them with git. Delete the branch once copied.
      - name: Publish screenshots to a branch (manual runs)
        if: github.event_name == 'workflow_dispatch' && !inputs.capture
        run: |
          ls screenshots/*.png >/dev/null 2>&1 || exit 0
          out=$(mktemp -d)
          cp screenshots/*.png "$out/"
          cd "$out"
          git init -q -b main
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Simulator screenshots from run ${{ github.run_id }} (${{ github.sha }})"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            "HEAD:refs/heads/screenshots/run-${{ github.run_id }}"
          echo "Pushed screenshots/run-${{ github.run_id }}"
      - name: Live API check (mempool.space, every chart and period)
        if: always()
        run: BLOCKPULSE_LIVE=1 swift test --package-path Packages/BitcoinKit --filter LiveSmokeTests
      # Manual runs also print small JPEG previews into the log, for reviewers who can't download artifacts.
      - name: Screenshot previews (manual runs)
        if: always() && github.event_name == 'workflow_dispatch' && !inputs.capture
        run: |
          for f in screenshots/*.png; do
            name=$(basename "$f" .png)
            sips -Z 560 -s format jpeg -s formatOptions 45 "$f" --out "/tmp/$name.jpg" >/dev/null
            echo "PREVIEW-BEGIN $name"
            base64 -i "/tmp/$name.jpg" | tr -d '\n' | fold -w 3000
            echo
            echo "PREVIEW-END $name"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshots
          path: |
            screenshots/
            build/xcodebuild.log
          if-no-files-found: ignore
