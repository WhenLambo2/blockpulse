name: Blockpulse
options:
  bundleIdPrefix: com.lazet
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  BitcoinKit:
    path: Packages/BitcoinKit
targets:
  Blockpulse:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: BitcoinKit
      - target: BlockpulseWidgets
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Blockpulse
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Blockpulse uses the camera to scan QR codes of Bitcoin addresses and transactions. Scanning happens on your iPhone and nothing is recorded.
        NSPhotoLibraryAddUsageDescription: Blockpulse saves the QR codes you choose to your photo library.
        CFBundleURLTypes:
          - CFBundleURLName: com.lazet.blockpulse
            CFBundleURLSchemes: [blockpulse]
        LSRequiresIPhoneOS: true
    entitlements:
      path: App/Blockpulse.entitlements
      properties:
        com.apple.security.application-groups: [group.com.lazet.blockpulse]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lazet.blockpulse
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  # Scripted Simulator takes for the launch film (scripts/mac-capture.sh). Not built by the app scheme.
  BlockpulseCapture:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Capture
    dependencies:
      - target: Blockpulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lazet.blockpulse.capture
        GENERATE_INFOPLIST_FILE: YES
  BlockpulseWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
    dependencies:
      - package: BitcoinKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Blockpulse Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/BlockpulseWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.lazet.blockpulse]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lazet.blockpulse.widgets
schemes:
  Blockpulse:
    build:
      targets:
        Blockpulse: all
    run:
      config: Debug
    archive:
      config: Release
  BlockpulseWidgets:
    build:
      targets:
        BlockpulseWidgets: all
    run:
      config: Debug
      askForAppToLaunch: true
      environmentVariables:
        _XCWidgetKind: ""
        _XCWidgetDefaultView: timeline
        _XCWidgetFamily: systemSmall
  BlockpulseCapture:
    build:
      targets:
        Blockpulse: all
        BlockpulseCapture: [test]
    test:
      config: Debug
      targets:
        - BlockpulseCapture
